{% extends "base.html" %}

{% block content %}
    <div class="post-entry">
        <h2>{{ post.title }}</h2>
        <p>{{ post.body }}</p>
    </div>

    <p><a href="{% url 'post-edit' post.pk %}">+ Edit Post Blog</a></p>
    <p><a href="{% url 'post-delete' post.pk %}">- Delete Post Blog</a></p>
{% endblock content %}
